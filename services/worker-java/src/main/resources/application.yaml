spring:
  application:
    name: worker-java
  main:
    web-application-type: none
    keep-alive: true
  rabbitmq:
    host: localhost
    port: 5672
    username: taskmesh
    password: ${RABBITMQ_PASSWORD:taskmesh_dev}
    # Topology remains externally provisioned; foundation startup is offline.
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: false
    listener:
      type: simple
      simple:
        # Enable only after registration, validation and settlement are implemented.
        auto-startup: false
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false
        retry:
          enabled: false
      direct:
        auto-startup: false

taskmesh:
  job-manager:
    base-url: ${JOB_MANAGER_BASE_URL:http://127.0.0.1:8080}
    registration:
      username: ${WORKER_REGISTRATION_USERNAME:worker-java-local}
      password: ${WORKER_REGISTRATION_PASSWORD:}

  worker:
    registration-on-startup: ${WORKER_REGISTER_ON_STARTUP:false}
    quarantine:
      confirm-timeout-ms: ${DLQ_CONFIRM_TIMEOUT_MS:10000}
    renewal:
      initial-delay-ms: ${WORKER_RENEWAL_INITIAL_DELAY_MS:60000}
      check-interval-ms: ${WORKER_RENEWAL_CHECK_INTERVAL_MS:60000}