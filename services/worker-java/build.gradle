plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.valossa515'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'com.networknt:json-schema-validator:3.0.9'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
}

tasks.named('processResources') {
    from(rootProject.file('../../contracts/schemas')) {
        include 'job-submitted.schema.json'
        into 'contracts/schemas'
    }
}

tasks.named('processTestResources') {
    from(rootProject.file('../../contracts/examples')) {
        include 'job-submitted.json'
        into 'contracts/examples'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


