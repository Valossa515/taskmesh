taskmesh.rabbitmq.initialize-on-startup=false

# RabbitMQ publisher reliability
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

taskmesh.publisher.confirm-timeout-seconds=10
taskmesh.publisher.lease-seconds=30
taskmesh.publisher.lease-safety-margin-seconds=5

# Outbox scheduler
taskmesh.publisher.scheduling.enabled=false
taskmesh.publisher.scheduling.fixed-delay-ms=5000
taskmesh.publisher.scheduling.initial-delay-ms=5000

management.endpoints.web.exposure.include=health,info,metrics,prometheus