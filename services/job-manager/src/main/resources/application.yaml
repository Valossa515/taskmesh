
spring:
  application:
    name: job-manager

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/taskmesh
    username: taskmesh
    password: ${DB_PASSWORD:taskmesh_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: taskmesh
    password: ${RABBITMQ_PASSWORD:taskmesh_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

taskmesh:
  publisher:
    confirm-timeout-seconds: 10
    lease-seconds: 30
    lease-safety-margin-seconds: 5
    scheduling:
      enabled: false
      fixed-delay-ms: 5000
      initial-delay-ms: 5000
  execution:
    expiration:
      batch-size: 100
      scheduling:
        enabled: false
        fixed-delay-ms: 5000
        initial-delay-ms: 5000
  security:
    java-password: ${WORKER_JAVA_PASSWORD:}
    dotnet-password: ${WORKER_DOTNET_PASSWORD:}
    worker-instance-registration:
      enabled: false
      signing-key-base64: ${WORKER_INSTANCE_JWT_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  prometheus:
    metrics:
      export:
        enabled: true