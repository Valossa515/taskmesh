
spring:
  application:
    name: job-manager

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/taskmesh
    username: taskmesh
    password: ${DB_PASSWORD:taskmesh_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: taskmesh
    password: ${RABBITMQ_PASSWORD:taskmesh_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 8080
