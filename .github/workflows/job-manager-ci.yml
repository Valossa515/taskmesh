name: Job Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/job-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            services/job-manager/*.gradle
            services/job-manager/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: contracts/requirements-dev.txt

      - name: Install contract test dependencies
        working-directory: .
        run: python -m pip install -r contracts/requirements-dev.txt

      - name: Validate messaging contracts
        working-directory: .
        run: python -m unittest discover -s contracts/tests -p "test_*.py" -v

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit and integration tests
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-manager-test-reports
          path: services/job-manager/build/reports/tests/test/
          if-no-files-found: ignore
